name: 作品批准上架
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.event.label.name == '通过上架' && github.actor == github.repository_owner && startsWith(github.event.issue.title, '[作品申请]')
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      REVIEWER: ${{ github.repository_owner }}
    steps:
      - uses: actions/checkout@v4
      - name: 核对批准快照与试玩文件
        id: validate
        shell: bash
        run: |
          if python3 scripts/publish_work.py "$GITHUB_EVENT_PATH" "$REVIEWER" validate "$RUNNER_TEMP/approved-work.json" 2>"$RUNNER_TEMP/work-error"; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            cat "$RUNNER_TEMP/work-error"
            message=$(head -n 1 "$RUNNER_TEMP/work-error")
            gh issue comment "$ISSUE_NUMBER" --body "作品上架检查未通过。$message。修正后请联系老师重新添加「通过上架」标签。"
            exit 1
          fi
      - name: 更新公开清单
        if: steps.validate.outputs.passed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin +refs/heads/main:refs/remotes/origin/main
            git switch --force-create publish-catalog origin/main
            python3 scripts/publish_work.py "$GITHUB_EVENT_PATH" "$REVIEWER" merge "$RUNNER_TEMP/approved-work.json"
            git add approved-works.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Approve work from issue #$ISSUE_NUMBER"
            if git push origin HEAD:refs/heads/main; then exit 0; fi
            sleep "$((attempt * 2))"
          done
          exit 1
      - name: 回报上架结果
        if: always() && steps.validate.outputs.passed == 'true'
        env:
          JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ "$JOB_STATUS" = success ]; then
            gh issue comment "$ISSUE_NUMBER" --body '已写入公开作品清单。稍等 GitHub 缓存更新后，刷新学习网站的「同学作品」即可查看。'
          else
            gh issue comment "$ISSUE_NUMBER" --body '试玩文件检查已通过，公开清单写入失败。请老师查看本次 Actions 日志，修复后重新运行。'
          fi
